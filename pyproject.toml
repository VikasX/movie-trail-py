[project]
name = "cinescope-api"
version = "0.1.0"
description = "CineScope Django REST API"
requires-python = ">=3.12,<3.15"
dependencies = [
    "Django==6.1.3",
    "djangorestframework==3.18.3",
    "psycopg[binary]==3.3.9",
    "django-cors-headers==4.9.0",
    "django-environ==0.14.0",
    "django-filter==26.2",
    "drf-spectacular==0.30.0",
    "httpx==0.28.1",
    "django-allauth[socialaccount]==65.22.1",
    "cryptography==50.0.2",
]

[tool.vercel]
entrypoint = "config.wsgi:application"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
